name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies by design, so there is nothing to install.
      - name: Run tests
        run: npm test

      # Catches a hand-edited data/recipes.json (or data/meta.json) that no
      # longer matches data/prices.json. test/data-build.test.js asserts the
      # same thing, but failing here names the fix directly.
      #
      # This only works because the generator is deterministic — see buildMeta()
      # in scripts/build-data.mjs, which deliberately carries no build
      # timestamp. Adding one here would make this step fail on every run.
      - name: Check generated data is in sync
        run: |
          npm run build:data
          git diff --exit-code data/recipes.json data/meta.json \
            || (echo "::error::generated data is stale — run 'npm run build:data' and commit the result" && exit 1)
